---
# Create + maintain PBS datastores listed in `pbs_datastores`. Uses the
# `proxmox-backup-manager` CLI (one binary, talks to the running PBS
# proxy over a local Unix socket — no API auth plumbing needed from
# inside the host).
#
# Per datastore:
#   1. Ensure the on-disk directory exists at `<path>`.
#   2. Check if PBS already knows about a datastore by that name.
#   3. If not, create it.
#
# Prune retention is NOT configured here. PBS 4.x removed per-datastore
# prune settings ("datastore prune settings have been replaced by prune
# jobs") — prune is now a separate job type, created in tasks/pbs_jobs.yml
# alongside verify jobs. The retention values in inventory's
# `pbs_datastores[].prune_keep_*` are consumed by pbs_jobs.yml when it
# creates the per-datastore prune-job.
#
# Idempotency comes from the existence check before create.
#
# References:
#   - `proxmox-backup-manager help datastore`
#   - `proxmox-backup-manager help prune-job`
#   - https://pbs.proxmox.com/docs/managing-datastores.html

- name: Ensure datastore filesystem directories exist
  ansible.builtin.file:
    path: "{{ ds.path }}"
    state: directory
    owner: backup
    group: backup
    mode: "0755"
  loop: "{{ pbs_datastores }}"
  loop_control:
    loop_var: ds
    label: "{{ ds.name }} -> {{ ds.path }}"

# Snapshot the current set of datastores. Used by the next task to
# decide create-vs-skip without parsing CLI free text — JSON output
# is stable across PBS versions.
- name: Query existing PBS datastores
  ansible.builtin.command: "{{ pbs_mgr_bin }} datastore list --output-format json"
  register: pbs_existing_datastores
  changed_when: false
  # Pure read. ansible.builtin.command is skipped in check mode by
  # default; without the override, the parse task below would receive
  # an empty stdout and `from_json` would fail with "Expecting value:
  # line 1 column 1 (char 0)".
  check_mode: false

- name: Parse existing datastore names
  ansible.builtin.set_fact:
    pbs_existing_datastore_names: >-
      {{ (pbs_existing_datastores.stdout | from_json)
         | map(attribute='name') | list }}

- name: Create missing PBS datastores
  ansible.builtin.command: >-
    {{ pbs_mgr_bin }} datastore create {{ ds.name }} {{ ds.path }}
  loop: "{{ pbs_datastores }}"
  loop_control:
    loop_var: ds
    label: "{{ ds.name }}"
  when: ds.name not in pbs_existing_datastore_names
  register: pbs_datastore_create
  changed_when: pbs_datastore_create.rc == 0

# Prune retention is handled by tasks/pbs_jobs.yml — see header.

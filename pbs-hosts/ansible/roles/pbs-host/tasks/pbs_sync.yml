---
# Sync configuration: remote PBS server definitions + sync job
# definitions. Gated by `pbs_sync_enabled` in inventory (default false),
# so this file is a no-op until the IL replica exists and the operator
# flips the toggle.
#
# Sync direction: PBS 4.x's `sync-job create` accepts `--sync-direction
# push` to flip from the default pull. We push (FL → IL) so the IL site
# never holds a credential that lets it reach back into FL — push-only
# is a one-way trust boundary.
#
# Encryption note: PBS does encrypted-at-rest on the destination
# datastore by setting an `encryption_key` on that datastore object;
# encryption is NOT a sync-job flag. The `j.encrypt` field in inventory
# is documentation-only for now. To actually encrypt the offsite copy:
# create the destination datastore on `pbs02` with `--encryption-key
# <generated>`. We'll surface that step when the IL hardware lands.
#
# Secret management: each remote's password is read from the env var
# `PBS_<UPPERCASED_VAR_NAME>` at apply time. Hydrate it from KeePassXC
# (or OpenBao after that role lands) before invoking the play:
#   PBS_PBS02_IL_TOKEN="$(keepassxc-cli show ...)" just pbs-hosts
# The role passes the secret to `remote create` via stdin (not argv —
# argv shows up in /proc/<pid>/cmdline). PBS 4.x's CLI accepts
# `--password -` to read from stdin.

# ---- Pre-flight: required env vars present --------------------------
# Fail BEFORE attempting to create any remote. If a password env var
# is missing, the create call would otherwise fire with an empty
# password and PBS would either reject the call or (worse) create the
# remote with an empty password silently.

- name: Validate password env vars are set for every remote
  ansible.builtin.fail:
    msg: >-
      Remote {{ r.name }} requires environment variable
      PBS_{{ (r.password_var | upper) }} to be set at apply time.
      Hydrate from KeePassXC/OpenBao before re-running.
  loop: "{{ pbs_sync_remotes }}"
  loop_control:
    loop_var: r
    label: "{{ r.name }}"
  when: (lookup('env', 'PBS_' + (r.password_var | upper)) | length) == 0

# ---- Remotes --------------------------------------------------------

- name: Query existing PBS remotes
  ansible.builtin.command: "{{ pbs_mgr_bin }} remote list --output-format json"
  register: pbs_existing_remotes
  changed_when: false

- name: Parse existing remote names
  ansible.builtin.set_fact:
    pbs_existing_remote_names: >-
      {{ (pbs_existing_remotes.stdout | from_json) | map(attribute='name') | list }}

# `--password -` reads the secret from stdin so it never lands in the
# process table. `no_log: true` masks the stdin payload from Ansible's
# play output.
- name: Create missing PBS remotes
  ansible.builtin.command:
    cmd: >-
      {{ pbs_mgr_bin }} remote create {{ r.name }}
      --host {{ r.host }}
      --auth-id {{ r.auth_id }}
      --password -
    stdin: "{{ lookup('env', 'PBS_' + (r.password_var | upper)) }}"
  loop: "{{ pbs_sync_remotes }}"
  loop_control:
    loop_var: r
    label: "{{ r.name }}"
  when: r.name not in pbs_existing_remote_names
  no_log: true
  register: pbs_remote_create
  changed_when: pbs_remote_create.rc == 0

# ---- Sync jobs ------------------------------------------------------

- name: Query existing PBS sync jobs
  ansible.builtin.command: "{{ pbs_mgr_bin }} sync-job list --output-format json"
  register: pbs_existing_sync_jobs
  changed_when: false

- name: Parse existing sync-job IDs
  ansible.builtin.set_fact:
    pbs_existing_sync_job_ids: >-
      {{ (pbs_existing_sync_jobs.stdout | from_json) | map(attribute='id') | list }}

# Sync job ID is positional. No --encrypted-only flag exists; encryption
# is a property of the destination datastore (see header). No worker-
# count flag either; PBS parallelizes internally.
- name: Create missing PBS sync jobs
  ansible.builtin.command: >-
    {{ pbs_mgr_bin }} sync-job create {{ j.id }}
    --store {{ j.source_datastore }}
    --remote {{ j.remote }}
    --remote-store {{ j.remote_datastore }}
    --schedule "{{ j.schedule }}"
    --sync-direction {{ j.direction | default('push') }}
  loop: "{{ pbs_sync_jobs }}"
  loop_control:
    loop_var: j
    label: "{{ j.id }}"
  when: j.id not in pbs_existing_sync_job_ids
  register: pbs_sync_job_create
  changed_when: pbs_sync_job_create.rc == 0

---
# Replace the enterprise APT sources with the no-subscription set, in
# deb822 format. The PBS installer ships an enterprise repo pointing at
# enterprise.proxmox.com which 401s without a subscription; we remove
# it (so apt stops failing on every update) and write our own deb822
# sources file covering Debian base + PBS no-subscription.
#
# PBS repo URL differs from PVE:
#   PVE: http://download.proxmox.com/debian/pve  component=pve-no-subscription
#   PBS: http://download.proxmox.com/debian/pbs  component=pbs-no-subscription
#
# Reference: https://pbs.proxmox.com/wiki/index.php/Package_Repositories
#
# Idempotency: file module reports `changed` only when the .sources
# template renders different bytes. `apt update` fires via handler ONLY
# when the source list changes, so re-runs on a healthy host are silent.

- name: Remove legacy enterprise PBS repo (single-line format)
  ansible.builtin.file:
    path: "{{ pbs_host_enterprise_list }}"
    state: absent
  notify: Apt update

# Newer PBS installers ship deb822-format enterprise sources alongside
# (or instead of) the legacy single-line variants. Same URLs, same 401
# problem. Remove both forms so re-runs don't depend on installer
# vintage.
- name: Remove enterprise PBS repo (deb822 format)
  ansible.builtin.file:
    path: "{{ pbs_host_enterprise_sources }}"
    state: absent
  notify: Apt update

# Proxmox's archive key ships with the proxmox-archive-keyring package
# on a stock install. Ensure it's present before the no-subscription
# repo file references it via Signed-By.
- name: Ensure proxmox-archive-keyring is installed
  ansible.builtin.apt:
    name: proxmox-archive-keyring
    state: present
    update_cache: false

- name: Write PBS + Debian no-subscription sources (deb822)
  ansible.builtin.template:
    src: etc/apt/sources.list.d/pbs-no-subscription.sources.j2
    dest: "{{ pbs_host_sources_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Apt update

# Force the update before downstream tasks (packages.yml) try to install
# anything. The handler-flush guarantees the cache is fresh.
- name: Flush handlers (refresh apt cache before package installs)
  ansible.builtin.meta: flush_handlers

---
# Defaults for the pve-host role. Override anything here in inventory
# (group_vars / host_vars / inline `vars:` blocks). Inventory wins; this
# file is the fallback so a fresh `inventory.yml` doesn't need to list
# every knob.
#
# See pve-hosts/CLAUDE.md for the role's full intent and the vault doc
# [[Thunderbolt Mesh Networking — 3-Node Cluster Option]] for the
# authoritative TB fabric design (addresses, MTU, transit placement).

# ----- packages -------------------------------------------------------
# Baseline package set installed by tasks/packages.yml. Aim small: only
# things useful on every PVE host. Role-specific packages (qemu-utils,
# vfio tooling, etc.) belong in role-specific plays or the operator's
# follow-on docs. state: present, not latest — upgrades are a separate
# operator decision (see "What this role MUST NOT do" in CLAUDE.md).
pve_host_packages:
  - ifupdown2          # ifreload -a support; required for hot interface reloads
  - vim
  - htop
  - iperf3             # used in TB fabric Phase 6 throughput tests
  - ethtool
  - bridge-utils
  - lldpd              # neighbor discovery on the 2.5GbE + TB fabric
  - chrony             # NTP, replaces systemd-timesyncd (see tasks/time.yml)
  - tmux
  - curl
  - jq
  - dnsutils
  - tcpdump
  - pciutils           # lspci — TB controller checks per the vault runbook
  - usbutils
  # bolt: TB peripheral enrollment (Razer Core X eGPU on pve12t). TB
  # *peer-host* connections are NOT enrolled via boltctl — synthesized
  # UUIDs aren't supported. See tasks/thunderbolt.yml step (b) for the
  # udev-based path peers use.
  - bolt
  # at: safety net for risky changes over SSH. `echo cmd | at now + N min`
  # schedules a rollback that fires if the SSH session dies before we
  # can cancel it. Debian's postinst enables atd automatically.
  - at

# ----- apt repos ------------------------------------------------------
# Where the .sources file lands. trixie + pve-no-subscription, deb822
# format. See templates/etc/apt/sources.list.d/pve-no-subscription.sources.j2.
pve_host_sources_file: /etc/apt/sources.list.d/pve-no-subscription.sources

# Legacy single-line enterprise repo dropped by Proxmox's installer.
# tasks/repo.yml removes this so apt-get update stops complaining about
# the missing subscription.
pve_host_enterprise_list: /etc/apt/sources.list.d/pve-enterprise.list

# ----- NFS ------------------------------------------------------------
# Mount options for the Asustor NFS share. vers=4.2 picks up file-locking
# + delegations needed for Proxmox storage. _netdev keeps the mount from
# blocking boot if the NAS is offline. noatime cuts spurious writebacks.
pve_host_nfs_options: "vers=4.2,_netdev,noatime,rsize=1048576,wsize=1048576"

# ----- firewall -------------------------------------------------------
# Whether the role should drop the cluster.fw template into /etc/pve.
# The CLAUDE.md spec keeps this on by default and uses run_once +
# delegate_to to avoid pmxcfs write races. Flip to false during cluster
# bring-up if pve-firewall is fighting the corosync ring1 traffic.
pve_host_manage_cluster_firewall: true

# ----- network handler ------------------------------------------------
# Safety rail: tasks/network.yml never runs `ifreload -a` automatically.
# It only stages /etc/network/interfaces and fires a handler that prints
# a one-line "manual reload required from console" notice. Flip to true
# only in CI/molecule contexts where you've decoupled the play host from
# the target's networking.
pve_host_auto_reload_networking: false

# ----- UPS shutdown guardian ------------------------------------------
# On UPS power loss, gracefully shut down this node's guests then power
# the node off BEFORE the NAS (which serves the NFS backing the guests'
# disks) reaches its own low-battery cutoff. Ordering is enforced by a
# battery-charge gap, not the NUT primary/secondary handshake (the
# Asustor upsd does not wait for network clients). See pve-hosts/README.md
# and the design vault [[nut-ordered-shutdown-design]].
#
# OFF by default: this powers off hosts on trigger, so it's opt-in.
# Enable per-cluster in inventory AFTER setting pve_host_ups_nut_target
# and testing with pve_host_ups_dry_run: true.
pve_host_manage_ups_guardian: false

# "<upsname>@<host>" of the NAS upsd that owns the UPS (read-only upsc
# access is all that's needed). Placeholder is an RFC 5737 doc address —
# set the real value in inventory and verify with `upsc <target>`.
pve_host_ups_nut_target: "asustor@192.0.2.10"

# Begin the shutdown when on battery AND charge <= this percent. 50
# matches the UPS's battery.charge.warning and sits far above the NAS's
# battery.charge.low (10%) — the 50->10 gap is the ordering guarantee.
# pbs01 triggers higher (60%) so it clears first; see pbs-host's role.
pve_host_ups_charge_threshold: 50

# Per-guest ACPI shutdown timeout (seconds) before force-stop. Generous
# for the amp-game Minecraft JVM to flush worlds on SIGTERM.
pve_host_ups_shutdown_timeout: 180

# VMIDs never auto-shut. Empty by design — for an unattended outage you
# want everything down gracefully rather than NFS-yanked.
pve_host_ups_exclude_vmids: []

# upsd-unreachable behavior: "log" (conservative default — a network blip
# must not power off the cluster) or "shutdown".
pve_host_ups_comms_loss_action: "log"

# Simulate without powering anything off (logs the intended sweep). Set
# true for the first validation run.
pve_host_ups_dry_run: false

# Poll cadence and the post-boot delay before the first poll (systemd
# time spans). The poll is cheap and a no-op on line power.
pve_host_ups_poll_interval: "20s"
pve_host_ups_poll_boot_delay: "2min"

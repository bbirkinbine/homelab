---
# Galaxy metadata for the pve-host role. Kept minimal — the role is
# only ever applied via the sibling site.yml against an inventory of
# PVE nodes Brian owns. There's no plan to publish to Galaxy.

galaxy_info:
  role_name: pve_host
  author: brian.birkinbine
  description: >-
    Layer-0 bootstrap for Proxmox VE 9.x hosts (Debian 13 / trixie).
    Configures APT, packages, chrony, /etc/hosts, /etc/network/interfaces
    with the Thunderbolt overlay, sysctl tuning, NFS mount, pve-firewall
    baseline, and operator SSH keys. Stops short of cluster join.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions:
        - trixie

dependencies: []

collections:
  # ansible.posix.mount — fstab + mount management for the NFS share.
  # ansible.posix.authorized_key — SSH key install for root.
  - ansible.posix
  # community.general — currently unused; reserved for future modules
  # if the role grows (e.g. pacemaker, proxmox.* modules).
  - community.general

---
galaxy_info:
  role_name: llm
  author: brian.birkinbine
  description: "Install OS-level prereqs for an eGPU-passthrough LLM VM on Ubuntu 24.04: NVIDIA server-branch driver, Docker, NVIDIA Container Toolkit, ufw rules, unattended-upgrades. Ollama itself is operator-installed post-role."
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions:
        - noble

dependencies: []

collections:
  # `community.general.ufw` — apt's ufw module ships there. Make the
  # dependency explicit so a fresh Ansible install knows what to fetch.
  - community.general

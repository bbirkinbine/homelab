---
# Tasks for the llm role.
#
# Runs against the inventory's llm_servers group as `llm-admin` (from
# cloud-init), `become: true` from site.yml.
#
# Cloud-init has already done: hostname, admin user + SSH key, sudo.
# This role installs the OS-level prereqs for serving LLMs on a
# passthrough GPU: NVIDIA server-branch driver, Docker, NVIDIA Container
# Toolkit, ufw rules, unattended-upgrades. Reboots once at end of play
# so the NVIDIA kernel module is live for subsequent operator work.
#
# Ollama itself is installed manually post-role — NOT here. The upstream
# install.sh's GPU-detection logic falls through to installing
# `cuda-drivers` from NVIDIA's CUDA apt repo whenever its `nvidia-smi`
# check races the kernel module init or fails for any other reason. That
# conflicts with the server-branch driver this role installs (different
# driver lineage, can't coexist) and breaks dpkg mid-transaction. There
# is no upstream env var to skip the CUDA branch.
#
# Same prereq-only pattern as the openbao / openclaw / nemoclaw roles.
# See vms/llm/README.md "Post-deploy" section for the operator steps
# that install Ollama (and optionally Open WebUI).

- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  # cloud-init might still be finishing apt-daily / unattended-upgrades
  # background work the moment Ansible first connects. Waiting here
  # avoids dpkg-lock races on the first apt task.

# --- Base prereqs ----------------------------------------------------------

- name: Install build prereqs + ubuntu-drivers + matching kernel headers
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - pciutils
      - build-essential
      - dkms
      - ubuntu-drivers-common
      # Kernel headers MUST match the running kernel for the NVIDIA
      # DKMS module to build. ansible_kernel resolves at runtime to
      # e.g. "6.8.0-31-generic"; the matching headers package is
      # linux-headers-<kernel-string>.
      - "linux-headers-{{ ansible_kernel }}"
    state: present
    update_cache: true
    # No cache_valid_time — Packer base wipes pkgcache.bin (the binary
    # index ansible's apt module stat()s for cache age), so
    # update_cache: true fires on every play. cache_valid_time would
    # mask that. Pattern established by amp_game / openbao / rootca.
  # Long timeout — apt-get on a fresh Packer base can take a while if
  # the security mirror is slow.
  register: llm_prereqs_apt
  retries: 3
  delay: 10
  until: llm_prereqs_apt is succeeded

- name: Install nvtop (htop for GPUs)
  ansible.builtin.apt:
    name: nvtop
    state: present
  when: llm_install_nvtop | bool

# --- NVIDIA driver ---------------------------------------------------------

# `ubuntu-drivers install --gpgpu` picks the current recommended server-
# branch driver (e.g. nvidia-driver-570-server). Server branches are LTS-
# cycle and recommended for compute workloads. Auto-pick avoids the
# "pinned driver rots as kernels update" failure mode that hits when
# the apt repo deprecates a specific version.
- name: Check whether nvidia-smi is already installed
  ansible.builtin.command: which nvidia-smi
  register: llm_nvidia_smi
  changed_when: false
  failed_when: false

- name: Install NVIDIA server-branch driver (ubuntu-drivers --gpgpu)
  ansible.builtin.command: ubuntu-drivers install --gpgpu
  when: llm_nvidia_smi.rc != 0
  register: llm_driver_install
  changed_when: llm_driver_install.rc == 0
  notify: Reboot for NVIDIA kernel module

# ubuntu-drivers invokes `apt install --no-install-recommends`, which
# excludes nvidia-utils-XXX-server — the package that provides
# /usr/bin/nvidia-smi. The compute libraries work without it (the kernel
# module loads, libcuda is present, Ollama runs), but operators expect
# nvidia-smi for sanity-checking. Backfill it by detecting the installed
# branch number from the nvidia-compute-utils-*-server package that
# ubuntu-drivers DID install, then apt-installing the matching utils.
- name: Backfill nvidia-utils-<branch>-server (provides nvidia-smi)
  ansible.builtin.shell: |
    set -euo pipefail
    branch=$(dpkg-query -W -f '${Package}\n' 'nvidia-compute-utils-*-server' 2>/dev/null \
             | head -1 | sed -E 's/nvidia-compute-utils-([0-9]+)-server/\1/')
    [ -n "$branch" ] || { echo "no nvidia-compute-utils-*-server installed" >&2; exit 1; }
    apt-get install -y "nvidia-utils-${branch}-server"
  args:
    executable: /bin/bash
    creates: /usr/bin/nvidia-smi

# --- Docker ----------------------------------------------------------------

- name: Install Docker + compose-v2 (Ubuntu repos)
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
    # No cache_valid_time — see prereqs task above.

# Add the connecting admin user to the docker group so `docker run`
# works without sudo (needed for the operator-installed Open WebUI step
# in README "Post-deploy"). Safe in this role's threat model — the
# admin user already has NOPASSWD sudo from cloud-init, so docker-group
# membership isn't an escalation. Takes effect on next login.
- name: Add admin user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

# --- NVIDIA Container Toolkit ----------------------------------------------
# Adds GPU access to Docker containers. Required for any LLM-in-container
# workflow (Open WebUI doesn't need it directly, but anything running
# ollama / vLLM / TensorRT-LLM inside Docker does).

- name: Ensure /usr/share/keyrings exists for the NVIDIA toolkit GPG key
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Fetch NVIDIA Container Toolkit GPG key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /tmp/nvidia-container-toolkit-key.asc
    mode: "0644"
    force: false
  register: llm_nv_key_download

- name: Dearmor NVIDIA Container Toolkit GPG key into keyring
  ansible.builtin.command:
    cmd: gpg --dearmor --batch --yes -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg /tmp/nvidia-container-toolkit-key.asc
    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

- name: Fetch NVIDIA Container Toolkit apt source list (rewriting deb URL with the keyring)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
        | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
        > /etc/apt/sources.list.d/nvidia-container-toolkit.list
    # pipefail is bash-only; Ansible's shell module defaults to /bin/sh
    # (dash on Ubuntu), which rejects `set -o pipefail`.
    executable: /bin/bash
    creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list

- name: Install nvidia-container-toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true

- name: Configure docker runtime for NVIDIA (writes /etc/docker/daemon.json runtime block)
  ansible.builtin.command:
    cmd: nvidia-ctk runtime configure --runtime=docker
    creates: /etc/docker/daemon.json
  notify: Restart docker

# --- ufw -------------------------------------------------------------------
# Ports 11434 + 8080 are opened proactively even though Ollama and Open
# WebUI are installed manually post-role. The operator knows the future
# app surface; opening the ports here avoids a second ufw round-trip
# when those apps come up.

- name: Allow LLM-stack ports through ufw
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: tcp
    comment: "{{ item.comment }}"
  loop: "{{ llm_ufw_ports }}"
  notify: Reload ufw

# --- unattended-upgrades ----------------------------------------------------
# Base template ships with these timers masked so locked-down roles can
# stay frozen. llm gets normal security patches.

- name: Unmask + enable apt-daily timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    masked: false
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Ensure unattended-upgrades is configured for security patches
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";

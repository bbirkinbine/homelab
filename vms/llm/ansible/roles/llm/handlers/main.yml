---
# Handlers for the llm role. Triggered via `notify:` in tasks/main.yml.

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
  # Triggered after `nvidia-ctk runtime configure` to pick up the NVIDIA
  # runtime registration in /etc/docker/daemon.json.

- name: Reload ufw
  community.general.ufw:
    state: reloaded

- name: Reboot for NVIDIA kernel module
  ansible.builtin.reboot:
    msg: "Rebooting to load the NVIDIA kernel module after driver install."
    reboot_timeout: 600
  when: llm_reboot_after_driver_install | bool
  # Without this reboot, `nvidia-smi` fails until the next boot ("No
  # devices were found" / kernel module not loaded). Fires at end of
  # play; subsequent operator steps (Ollama install per README) run
  # against a VM with the GPU live.

---
# Defaults for the monitoring role.
#
# The big-picture design is in [[Homelab Monitoring — Prometheus, Grafana, and
# the MVP Dashboard]] (vault). Operator-facing flow is in vms/monitoring/README.md.

# --- Scrape targets ---------------------------------------------------------
# Keep targets as plain hostnames (not IPs) so DNS / /etc/hosts changes
# propagate without re-templating. The monitoring VM's own /etc/hosts ships
# LAN entries for these via hosts_file.yml — if you haven't bootstrapped the
# PVE/PBS hosts yet, override monitoring_lan_hosts (below) with IPs.
#
# Two layers feed the node_exporter scrape job:
#
#   1. monitoring_static_targets — the non-role hosts (the monitoring VM
#      itself, the PVE cluster nodes, the PBS host). They aren't managed
#      under vms/<role>/, so they're listed explicitly here. Edit this list
#      when adding/removing a PVE node or a backup-target host.
#
#   2. Per-role guest VMs — discovered at deploy time by discover_targets.yml,
#      which globs vms/*/monitoring-target.yml. A role cloned from
#      vms/_template/ ships that marker file, so it's scraped by default; to
#      opt a role out, delete its file (git-visible). rootca keeps no file —
#      air-gapped + HSM-pinned, security posture trumps observability.
#
# discover_targets.yml composes monitoring_node_exporter_targets =
# monitoring_static_targets + discovered guests. The seed below just keeps
# the var defined if discovery is somehow skipped (e.g. ad-hoc --tags run).

monitoring_static_targets:
  - host: monitoring
    instance: monitoring
  - host: pve12t
    instance: pve12t
  - host: pve13m
    instance: pve13m
  - host: pve13t
    instance: pve13t
  - host: pbs01
    instance: pbs01

monitoring_node_exporter_targets: []

# Where pve_exporter pulls from. One target per cluster node so a node-local
# outage doesn't blind the whole cluster view. The exporter scrapes the API
# per-target, so a token valid against any node works against all of them
# (pmxcfs replicates user.cfg cluster-wide).
monitoring_pve_targets:
  - pve12t
  - pve13m
  - pve13t

# Where pbs_exporter pulls from. Single-host today per project_pbs01_baseline.
monitoring_pbs_target: pbs01

# --- Prometheus -------------------------------------------------------------

monitoring_prometheus_scrape_interval: 15s
monitoring_prometheus_evaluation_interval: 15s

# Retention. Default 15d matches Prometheus's own default; bump to 30d/90d
# after the MVP has run a couple of weeks (design doc §9). Storage cost is
# small — the 64 GB boot disk covers 90d at this scrape rate comfortably.
monitoring_prometheus_retention_time: 15d

# --- prometheus-pve-exporter ------------------------------------------------
# Upstream provides no apt package (PyPI + Docker only — verified against
# github.com/prometheus-pve/prometheus-pve-exporter). The role installs into
# a dedicated venv so the system python is left untouched.

monitoring_pve_exporter_user: prometheus-pve-exporter
monitoring_pve_exporter_group: prometheus-pve-exporter
monitoring_pve_exporter_venv: /opt/prometheus-pve-exporter
monitoring_pve_exporter_config: /etc/prometheus/pve.yml
monitoring_pve_exporter_port: 9221
# Pin the version. Bump deliberately + re-test; do not auto-track latest.
# Available versions visible at https://pypi.org/project/prometheus-pve-exporter/#history.
monitoring_pve_exporter_version: "3.9.0"

# --- prometheus-pbs-exporter (natrontech/pbs-exporter) ----------------------
# Verified against github.com/natrontech/pbs-exporter — actively maintained
# (v0.9.0 Apr 2026); prebuilt linux/amd64 tarball; env-var configuration.

monitoring_pbs_exporter_user: prometheus-pbs-exporter
monitoring_pbs_exporter_group: prometheus-pbs-exporter
monitoring_pbs_exporter_bin: /usr/local/bin/pbs-exporter
monitoring_pbs_exporter_env: /etc/prometheus/pbs-exporter.env
monitoring_pbs_exporter_port: 10019
monitoring_pbs_exporter_version: "0.9.0"
monitoring_pbs_exporter_endpoint: "https://pbs01:8007"
# Skip TLS verification — PBS uses a self-signed cert by default. Flip
# to false once OpenBao's PKI engine starts issuing real certs and the
# PBS host is reconfigured to use them. The exporter env var is
# PBS_INSECURE (NOT PBS_VERIFY_SSL — easy to confuse).
monitoring_pbs_exporter_insecure: true

# --- DCGM exporter (NVIDIA GPU metrics) -------------------------------------
# Optional scrape target. NVIDIA DCGM Exporter runs as an operator-deployed
# Docker container ON THE llm VM (see vms/llm/README.md "Expose GPU metrics
# to Prometheus" step) — not part of any role install, because the LLM VM is
# the only GPU host and DCGM is a single docker run on top of the role's
# Docker + NVIDIA Container Toolkit prereqs.
#
# Set to empty string to skip the scrape job and dashboard provisioning
# entirely (e.g., before the DCGM container is up, or if the llm VM is
# down for maintenance). Re-enable + `just ansible monitoring` to start
# scraping again.
monitoring_dcgm_target: "llm:9400"

# --- prometheus-nut-exporter (HON95/prometheus-nut-exporter) ----------------
# Multi-target NUT exporter. HON95 ships Docker-only (no binary releases on
# GitHub, no apt package — verified 2026-05-20 against
# github.com/HON95/prometheus-nut-exporter v1.2.1), so the role installs
# docker.io and runs the upstream image as a systemd-managed container
# bound to localhost only (Prometheus is on the same VM).
#
# Scrape pattern is multi-target via `?target=<ups-server>:<port>` — same
# shape as prometheus-pve-exporter. monitoring_nut_target is the
# (host:port) of the NUT server, NOT the exporter. The exporter itself
# always listens on 127.0.0.1:{{ monitoring_nut_exporter_port }}.
#
# Set monitoring_nut_target to empty string to skip the scrape job and
# the dashboard. The exporter container will still be running but
# Prometheus won't query it. (Removing the container entirely would
# require disabling the systemd unit; for now keep it always installed
# since it's <50 MB resident and re-enabling means a single var flip.)
#
# Why IP instead of hostname: the monitoring VM doesn't currently
# resolve `nas` — only the pve_hosts / pbs_hosts groups are populated
# into /etc/hosts via the .extra-inventories sidecar pattern, and the
# NAS isn't in any sidecar inventory. A future cleanup could add a
# `nas_hosts` sidecar inventory (or extend monitoring_lan_hosts to be
# additive rather than override-only) so this could flip back to
# `nas:3493`. Until then, the IP is stable per Homelab Inventory.md.
monitoring_nut_target: "192.168.1.209:3493"
monitoring_nut_exporter_port: 9995
monitoring_nut_exporter_image: "hon95/prometheus-nut-exporter"
# Pin to a major-tag (`1`) — upstream's tagging convention is
# major-version floats forward inside a major. Bump deliberately:
# look at https://hub.docker.com/r/hon95/prometheus-nut-exporter/tags
# for newer tags + verify metrics still match dashboard 14371's
# selectors. `latest` exists but tracks main/dev — don't use.
monitoring_nut_exporter_image_tag: "1"
# UPS instance label that lands on every scraped metric. Pure cosmetic
# — Grafana dashboard 14371 doesn't filter by instance, only by `ups`
# (which is the UPS name inside NUT's protocol, e.g. "asustor"). This
# value is what the Prometheus /targets page shows.
monitoring_nut_instance_label: "nas"

# --- /etc/hosts -------------------------------------------------------------
# Override for the auto-built /etc/hosts entries. By default the role
# pulls `pve_lan_ip` / `pbs_lan_ip` from the pve-hosts + pbs-hosts
# inventories (loaded via vms/monitoring/ansible/.extra-inventories).
# Set this list in inventory.yml only if you're deploying without those
# sidecar inventories OR you want to override the auto-built entries.
#
# Shape (used both here and as the override):
#   monitoring_lan_hosts:
#     - { name: pve12t, ip: 192.0.2.227 }
#     - { name: pbs01,  ip: 192.0.2.250 }
monitoring_lan_hosts: []

# Guest VM inventory groups whose hosts the role pulls into /etc/hosts.
# Each entry is an Ansible group name (hyphens converted to underscores per
# Ansible's group-name normalization). For each group, the role reads
# `ansible_host` from each member and writes a `<ip>  <hostname>` line into
# /etc/hosts on the monitoring VM, so Prometheus's node_exporter scrapes
# resolve by hostname.
#
# DERIVED, not hand-maintained: discover_targets.yml sets this from the same
# vms/*/monitoring-target.yml glob that builds the scrape list, mapping each
# discovered instance to its `<role>_servers` group. The seed below just keeps
# the var defined if discovery is skipped. The matching inventories are loaded
# via vms/monitoring/ansible/.extra-inventories (a glob), so the groups are
# populated at play time; absent inventories are skipped silently.
#
# Why pull from per-role inventories instead of duplicating IPs here: the
# inventories are gitignored (real IPs), keeping this aligned with the repo's
# "VM IPs don't land in committed files" hygiene rule (root CLAUDE.md).
monitoring_guest_inventory_groups: []

# --- Grafana ----------------------------------------------------------------

monitoring_grafana_port: 3000
monitoring_grafana_datasource_name: Prometheus
# Lowercase. Pinned so community dashboards that hardcode
# `"uid": "prometheus"` (natrontech/pbs-exporter is one — they hardcode
# the UID rather than using the ${DS_PROMETHEUS} input convention) find
# the datasource without manual rewriting.
monitoring_grafana_datasource_uid: prometheus
monitoring_grafana_datasources_dir: /etc/grafana/provisioning/datasources
monitoring_grafana_dashboards_provisioning_dir: /etc/grafana/provisioning/dashboards
monitoring_grafana_dashboards_dir: /var/lib/grafana/dashboards

# Community dashboards provisioned into monitoring_grafana_dashboards_dir.
# Grafana's file provider re-scans the dir every 30s (config.yml) and
# auto-loads new/updated JSON. The file_name is what lands on disk;
# Grafana's internal dashboard title comes from the JSON itself.
#
# Pin grafana.com revisions deliberately — look up the latest with
#   curl -sf https://grafana.com/api/dashboards/<id> | jq .revision
# and bump + re-test panels when you want a newer version. The
# pbs-exporter dashboard is pinned to the same git tag as the
# matching exporter binary so it stays in lockstep on schema changes.
monitoring_dashboards:
  - file_name: "1860.json"
    url: https://grafana.com/api/dashboards/1860/revisions/45/download
  - file_name: "10347.json"
    url: https://grafana.com/api/dashboards/10347/revisions/5/download
  - file_name: pbs-exporter.json
    url: "https://raw.githubusercontent.com/natrontech/pbs-exporter/v{{ monitoring_pbs_exporter_version }}/grafana-dashboard/pbs-exporter.json"
  # NVIDIA DCGM Exporter Dashboard (grafana.com 12239, rev 2). Authored by
  # NVIDIA for Kubernetes DCGM deployments — the GPU-centric panels
  # (utilization, memory, power, temp, clocks) work fine against the bare-
  # Docker DCGM deployment on the llm VM, but K8s-label-filtered panels
  # (namespace/pod) will be empty. Acceptable for a single-host setup.
  - file_name: "12239.json"
    url: https://grafana.com/api/dashboards/12239/revisions/2/download
  # HON95 Prometheus NUT Exporter Dashboard (grafana.com 14371, rev 1).
  # Designed for the same upstream that ships monitoring_nut_exporter_image.
  # Panels select on `ups=~"${ups:pipe}"` so the dropdown auto-populates
  # from whatever UPS names NUT reports (in this lab: "asustor"). All
  # gauges use the `nut_*` metric prefix that HON95's exporter emits;
  # DRuggeri's alt exporter would not work with this dashboard (different
  # `network_ups_tools_*` prefix).
  - file_name: "14371.json"
    url: https://grafana.com/api/dashboards/14371/revisions/1/download

# Files left in monitoring_grafana_dashboards_dir by previous deploys
# that should be removed (idempotently). Add new entries here when
# retiring a dashboard; the role unlinks them on next apply.
monitoring_dashboards_to_remove:
  # Was originally pinned for the PBS slot before upstream verification —
  # turned out to be a Ceph "OSS statistics" dashboard, no PBS metrics.
  - 19641.json

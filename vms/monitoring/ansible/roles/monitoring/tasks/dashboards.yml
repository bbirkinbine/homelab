---
# Provision community Grafana dashboards into the file-watched dir.
# Grafana's dashboards provider (configured by config.yml) re-scans
# the dir every 30s and auto-loads new/updated JSON — no grafana-server
# restart required.
#
# Why we fetch + write rather than committing JSONs to the repo:
#   * Dashboards run to thousands of lines apiece; committing them
#     into the repo would dwarf the role's actual logic.
#   * The pin + substitution flow keeps the repo focused on which
#     upstream dashboards we use, not on their bodies.
#
# Why uri + copy + replace, rather than get_url:
#   * Each dashboard's JSON declares an "input" templated as
#     ${DS_PROMETHEUS} — Grafana's UI-import flow substitutes this
#     at import time. The file provider does NOT do that substitution,
#     so dropping the file as-downloaded leaves panels referencing a
#     literal "${DS_PROMETHEUS}" datasource that doesn't exist.
#   * We replace ${DS_PROMETHEUS} with the actual provisioned
#     datasource name (monitoring_grafana_datasource_name) before
#     writing. copy's idempotency check makes re-runs a no-op when
#     the upstream is unchanged.

- name: Remove stale community dashboards left by prior deploys
  ansible.builtin.file:
    path: "{{ monitoring_grafana_dashboards_dir }}/{{ item }}"
    state: absent
  loop: "{{ monitoring_dashboards_to_remove }}"

- name: Download community dashboard JSON
  ansible.builtin.uri:
    url: "{{ item.url }}"
    return_content: true
    status_code: 200
  loop: "{{ monitoring_dashboards }}"
  loop_control:
    label: "{{ item.file_name }}"
  register: monitoring_dashboard_downloads
  check_mode: false
  changed_when: false # idempotency tracked on the copy task below

- name: Install dashboard JSON (rewriting datasource placeholders to the pinned UID)
  ansible.builtin.copy:
    # Grafana.com dashboards declare datasource references as
    # `{"type": "prometheus", "uid": "${DS_PROMETHEUS}"}` — that placeholder
    # is the dashboard input slot the import-flow substitutes. The file
    # provider does NOT run that substitution, so we do it here.
    #
    # Substituting to the pinned datasource UID (lowercase `prometheus`)
    # instead of the name makes the rewritten dashboards work AND
    # natrontech-style dashboards that hardcode `"uid": "prometheus"`
    # work, all against the same provisioned datasource.
    #
    # Three placeholder variants surfaced in dashboards we provision so
    # far: ${DS_PROMETHEUS} (1860 / 10347 / 12239), ${ds_prometheus}
    # (1860 in places), and ${DS_PRIVATE_PROMETHEUS} (14371 — HON95).
    # Rather than enumerate every author's naming preference, regex any
    # ${DS_*} (uppercase) or ${ds_*} (lowercase) and rewrite to the
    # pinned UID. Grafana variable expressions like ${ups:pipe} are
    # NOT caught by these patterns (they don't start with DS_/ds_).
    content: >-
      {{
        dash.content
        | regex_replace('\$\{DS_[A-Z_]+\}', monitoring_grafana_datasource_uid)
        | regex_replace('\$\{ds_[a-z_]+\}', monitoring_grafana_datasource_uid)
      }}
    dest: "{{ monitoring_grafana_dashboards_dir }}/{{ dash.item.file_name }}"
    owner: grafana
    group: grafana
    mode: "0644"
  loop: "{{ monitoring_dashboard_downloads.results }}"
  loop_control:
    loop_var: dash
    label: "{{ dash.item.file_name }}"
  # No notify — the provisioner picks up changes on its own 30s scan.
  # Restarting grafana-server here would clear active operator
  # sessions for no benefit.

# Lab-local dashboards live as Jinja2-templated JSON under templates/dashboards/
# rather than as URLs in monitoring_dashboards. The template render swaps the
# datasource UID inline, so the file provider sees a fully-resolved dashboard
# — same end state as the regex_replace flow used for community dashboards.
- name: Install lab-local Grafana dashboards
  ansible.builtin.template:
    src: "dashboards/{{ item }}"
    dest: "{{ monitoring_grafana_dashboards_dir }}/{{ item | regex_replace('\\.j2$', '') }}"
    owner: grafana
    group: grafana
    mode: "0644"
  loop:
    # UPS Power & Energy — derives watts as nut_load × nominal capacity since
    # CyberPower BR-series UPSes don't expose ups.realpower directly. Pairs
    # with the nut_real_power_derived_watts recording rule.
    - ups-power.json.j2

---
# Maintain host entries for scrape targets the monitoring VM must reach
# by name: prometheus-node-exporter on each PVE node + pbs01, each guest
# VM, and pbs-exporter's hostname-based PBS_ENDPOINT.
#
# IMPORTANT — why this writes to TWO files. Every VM cloned from the
# homelab Packer base has `manage_etc_hosts: True` (set in
# /etc/cloud/cloud.cfg.d/99-homelab-datasource.cfg). cloud-init then
# regenerates /etc/hosts from /etc/cloud/templates/hosts.debian.tmpl on
# EVERY boot, silently discarding anything written straight to
# /etc/hosts. Writing only to /etc/hosts means the block survives until
# the next reboot and then vanishes — taking the PVE/PBS dashboards with
# it (the PVE nodes + pbs01 have static IPs and are not in router DNS,
# so name resolution depends entirely on this block). The block is
# therefore written to both:
#   - hosts.debian.tmpl : durable — cloud-init renders it into
#                         /etc/hosts on every boot.
#   - /etc/hosts        : immediate effect this run, no reboot needed.
# blockinfile keys on the marker, so the rendered-from-template copy and
# the direct copy reconcile to a single block — no duplication.
#
# Sources of truth (in priority order):
#   1. `monitoring_lan_hosts` set in inventory.yml — explicit operator
#      override as a list of `{name, ip}` dicts. Useful for one-off
#      deploys without the .extra-inventories wiring. When set, this
#      replaces the entire auto-built block.
#   2. Otherwise: pull `pve_lan_ip` / `pbs_lan_ip` from `groups['pve_hosts']`
#      / `groups['pbs_hosts']` hostvars, AND pull `ansible_host` from
#      each group in `monitoring_guest_inventory_groups`. These come
#      from the host-level pve-hosts / pbs-hosts inventories + the
#      per-role guest inventory.yml files, loaded at play time via
#      vms/monitoring/ansible/.extra-inventories (a sidecar the Justfile
#      `ansible` recipe picks up automatically — missing files
#      skipped silently).
#   3. Nothing populated (LAN-DNS-only deploy or running ad-hoc without
#      the sidecar) → skip silently.

- name: Maintain scrape-target host entries (cloud-init template + live /etc/hosts)
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    block: |
      {% if monitoring_lan_hosts | default([]) | length > 0 %}
      {% for h in monitoring_lan_hosts %}
      {{ h.ip }}   {{ h.name }}
      {% endfor %}
      {% else %}
      {% for h in groups.get('pve_hosts', []) | sort %}
      {% if hostvars[h].pve_lan_ip is defined %}
      {{ hostvars[h].pve_lan_ip }}   {{ h }}
      {% endif %}
      {% endfor %}
      {% for h in groups.get('pbs_hosts', []) | sort %}
      {% if hostvars[h].pbs_lan_ip is defined %}
      {{ hostvars[h].pbs_lan_ip }}   {{ h }}
      {% endif %}
      {% endfor %}
      {% for g in monitoring_guest_inventory_groups | default([]) %}
      {% for h in groups.get(g, []) | sort %}
      {% if hostvars[h].ansible_host is defined %}
      {{ hostvars[h].ansible_host }}   {{ h }}
      {% endif %}
      {% endfor %}
      {% endfor %}
      {% endif %}
    marker: "# {mark} ANSIBLE MANAGED — monitoring role scrape targets"
    create: false
  loop:
    - /etc/cloud/templates/hosts.debian.tmpl
    - /etc/hosts
  when: >-
    (monitoring_lan_hosts | default([]) | length > 0)
    or (groups.get('pve_hosts', []) | length > 0)
    or (groups.get('pbs_hosts', []) | length > 0)
    or (monitoring_guest_inventory_groups | default([])
        | map('extract', groups) | map('default', []) | flatten | length > 0)

---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted

- name: Restart grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted

- name: Restart prometheus-node-exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: restarted

# Exporters that read API-token configs the operator hand-pastes in the
# post-Ansible ceremony. The role intentionally does NOT notify these on
# first run (templates lay down placeholder configs); the operator
# restarts them once tokens are pasted. Listed here so subsequent
# config-only edits (scrape interval, target additions) trigger correctly.
- name: Restart prometheus-pve-exporter
  ansible.builtin.systemd:
    name: prometheus-pve-exporter
    state: restarted

- name: Restart prometheus-pbs-exporter
  ansible.builtin.systemd:
    name: prometheus-pbs-exporter
    state: restarted

- name: Restart prometheus-nut-exporter
  ansible.builtin.systemd:
    name: prometheus-nut-exporter
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"
  # Triggered on systemd unit changes (image tag bump, port change, env
  # var addition). Unlike pve / pbs exporters, no operator-pasted token
  # — NUT server accepts anon read access on this lab's Asustor.
  #
  # ignore_errors in check mode: on a first --check run, the systemd
  # unit file hasn't been written to disk (template tasks are no-ops
  # under --check), so a restart attempt fails with "Could not find
  # the requested service". Real applies write the unit and the
  # handler works normally. Once the role is applied for real once,
  # subsequent --check runs against the deployed VM also work because
  # the unit file is on disk.

---
# Galaxy collections this role pulls. Install with:
#   just ansible-deps monitoring
# Or directly:
#   ansible-galaxy collection install -r requirements.yml
collections:
  # community.general — ufw module, apt_repository helpers.
  - name: community.general
    version: ">=8.0.0"
  # ansible.posix — authorized_key + mount + sysctl helpers.
  - name: ansible.posix
    version: ">=1.5.0"

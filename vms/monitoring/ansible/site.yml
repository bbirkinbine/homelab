---
# vms/monitoring/ansible/site.yml
#
# Top-level play for the monitoring role. Runs the `monitoring` role
# against the inventory's `monitoring_servers` host group.
#
# Usage from repo root:
#   just ansible monitoring
# Or directly:
#   cd vms/monitoring/ansible && ansible-playbook -i inventory.yml site.yml

- name: Bootstrap monitoring
  hosts: monitoring_servers
  become: true
  gather_facts: true
  roles:
    - role: monitoring

---
- name: Run ldconfig
  ansible.builtin.command:
    cmd: ldconfig
  changed_when: true

- name: Reload udev
  ansible.builtin.command:
    cmd: udevadm control --reload-rules
  changed_when: true

- name: Restart polkit
  ansible.builtin.systemd:
    name: polkit
    state: restarted

- name: Restart pcscd
  ansible.builtin.systemd:
    name: pcscd
    state: restarted

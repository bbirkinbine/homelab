# Managed by Ansible — vms/openbao/ansible/roles/openbao/files/openbao-override.conf
#
# Drops into /etc/systemd/system/openbao.service.d/override.conf.
# OpenBao removed mlock (PR #363, pre-v2.5) and now recommends
# cgroups-based per-process swap restriction instead. MemorySwapMax=0
# tells systemd's cgroup v2 wrapper to refuse swap allocation for the
# openbao process tree — secret material can't be paged out to disk.
# Host-wide swap stays available for everything else.
# See https://openbao.org/docs/install/#post-installation-hardening.

[Service]
MemorySwapMax=0

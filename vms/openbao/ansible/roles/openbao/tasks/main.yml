---
# Configure OpenBao on a host where the operator has already installed
# the .deb from github.com/openbao/openbao/releases (GPG-verified —
# see vms/openbao/README.md "Install OpenBao"). The role lays down a
# Shamir-seal config and brings the service up. Stops short of
# `bao operator init` — that's an operator ceremony per
# [[OpenBao Homelab Setup]] Phase 3 (5 unseal shares, custody split
# between KeePassXC + paper envelopes).
#
# Why the operator installs the binary, not Ansible:
#   OpenBao is a trust anchor. The hands-on GPG-verified .deb fetch
#   keeps the chain of custody from upstream release to running
#   binary under the operator's direct control, which matches the
#   Shamir-share custody ceremony downstream. (OpenBao also doesn't
#   publish an apt repository — apt.openbao.org is NXDOMAIN — so the
#   alternative would be Ansible pinning a version + SHA, which adds
#   maintenance without restoring the trust property.)
#
# Idempotency:
#   * Pre-flight: stat — read-only.
#   * Config + override: managed via template/copy with explicit
#     modes and notify-based handlers.
#   * Service: systemd module with enabled+started — re-running is a
#     no-op once green.

# Fail fast if the operator hasn't installed OpenBao yet. The rest of
# the role hard-depends on the openbao user/group (created by the
# .deb postinst) and the unit file at /usr/lib/systemd/system/.
- name: Pre-flight — confirm OpenBao binary is installed
  ansible.builtin.stat:
    path: /usr/bin/bao
  register: openbao_binary
  check_mode: false

- name: Assert OpenBao binary is present
  ansible.builtin.assert:
    that:
      - openbao_binary.stat.exists
    fail_msg: >-
      OpenBao is not installed (/usr/bin/bao missing). Install the
      .deb from github.com/openbao/openbao/releases first — see
      vms/openbao/README.md "Install OpenBao" for the GPG-verified
      ceremony — then re-run this role.

# Sanity-check the version — Shamir is built into every release, but
# the PKI/Transit work in [[13 Homelab Blueprint]] downstream needs
# >= 2.5. Fail early here rather than discovering the gap during the
# init ceremony.
- name: Capture installed bao version
  ansible.builtin.command: bao --version
  register: openbao_version_raw
  changed_when: false
  # bao --version is read-only; run it even in --check so the assert
  # downstream has something to evaluate (otherwise check mode skips
  # this and the assert fails on an undefined variable).
  check_mode: false

- name: Assert OpenBao >= 2.5
  ansible.builtin.assert:
    that:
      - openbao_version_raw.stdout is regex('v?(2\\.[5-9]|2\\.[1-9][0-9]|[3-9]\\.[0-9])')
    fail_msg: >-
      OpenBao version is older than 2.5.x.
      Installed: {{ openbao_version_raw.stdout | trim }}.
      Upgrade by reinstalling a newer .deb from
      github.com/openbao/openbao/releases (see
      vms/openbao/README.md "Install OpenBao"), then re-run.

- name: Ensure OpenBao directories exist with correct ownership
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: openbao
    mode: "{{ item.mode }}"
  loop:
    # root:openbao 0750 — operator-editable, openbao-readable
    - { path: /etc/openbao, owner: root, mode: "0750" }
    # openbao:openbao 0700 — raft state; only the service touches it
    - { path: "{{ openbao_data_dir }}", owner: openbao, mode: "0700" }
    # openbao:openbao 0750 — audit logs; allow root + openbao read
    - { path: "{{ openbao_log_dir }}", owner: openbao, mode: "0750" }

- name: Render /etc/openbao/openbao.hcl
  ansible.builtin.template:
    src: openbao.hcl.j2
    dest: /etc/openbao/openbao.hcl
    owner: root
    group: openbao
    mode: "0640"
  notify: Restart openbao

# Replacement for the old mlock hardening: OpenBao now expects the
# operator to restrict swap at the systemd cgroup level instead of
# mlocking the process. Our override drops in MemorySwapMax=0 — see
# files/openbao-override.conf for the file + rationale. Set
# openbao_install_systemd_override to false in inventory to skip if
# you've configured equivalent protection host-wide.
- name: Ensure systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/openbao.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: openbao_install_systemd_override

- name: Install systemd drop-in for MemorySwapMax=0
  ansible.builtin.copy:
    src: openbao-override.conf
    dest: /etc/systemd/system/openbao.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  when: openbao_install_systemd_override
  notify:
    - Reload systemd
    - Restart openbao

- name: Enable and start openbao
  ansible.builtin.systemd:
    name: openbao
    enabled: true
    state: started
    daemon_reload: true

# Operator convenience: bao CLI defaults to HTTPS, but our listener
# is plain HTTP (tls_disable=1 — TLS lands in Phase 4 of
# [[13 Homelab Blueprint]]). Without BAO_ADDR exported, every
# interactive `bao status` / `bao operator unseal` greets the user
# with "http: server gave HTTP response to HTTPS client". Drop a
# profile.d snippet so the env var is set on every login. When TLS
# flips on later, openbao_api_addr updates to https:// and this
# snippet follows automatically.
- name: Export BAO_ADDR for interactive shells
  ansible.builtin.copy:
    dest: /etc/profile.d/openbao.sh
    content: |
      # Managed by Ansible — vms/openbao/ansible/roles/openbao
      export BAO_ADDR={{ openbao_api_addr }}
    owner: root
    group: root
    mode: "0644"

# OpenBao API port. The Packer base ships ufw with 22/tcp already
# allowed; this opens the API. We keep cluster port 8201 closed —
# only needed when an HA peer joins, which is not in scope today.
- name: Allow OpenBao API through ufw
  community.general.ufw:
    rule: allow
    port: "8200"
    proto: tcp
    comment: "OpenBao API"

# The Packer base masks apt-daily timers so locked-down roles can
# stay frozen. OpenBao is a trust anchor and patches must keep
# flowing — re-enable here.
- name: Unmask apt-daily timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: false
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Enable unattended-upgrades config
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

- name: Start apt-daily timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

# Final state check. `bao status` exits 2 when sealed (expected — we
# have not initialized), 0 when unsealed, 1 on connection error.
# We accept 0 OR 2; anything else means the service didn't come up.
# Skipped in --check because the systemd start task above is a no-op
# in check mode, so the service may not actually be listening.
- name: Confirm openbao is responding (sealed=2 or unsealed=0 both OK)
  ansible.builtin.command: bao status
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
  register: openbao_status
  failed_when: openbao_status.rc not in [0, 2]
  changed_when: false
  when: not ansible_check_mode

- name: Show bao status output
  ansible.builtin.debug:
    msg: "{{ openbao_status.stdout_lines }}"
  when: openbao_status.stdout_lines is defined

---
# Defaults for the openbao role. Override in inventory, group_vars, or
# host_vars if a deployment diverges; the defaults match the canonical
# Shamir-seal setup documented in [[OpenBao Homelab Setup]].
#
# The OpenBao binary itself is NOT installed by this role — the
# operator does that with a GPG-verified .deb fetch before running
# Ansible. See vms/openbao/README.md "Install OpenBao". Reasoning is
# in tasks/main.yml's header comment.

# Raft node id. Becomes the `node_id` field in the storage block of
# openbao.hcl. Single-node today; if you add HA replicas later, give
# each host a distinct id (e.g. homelab-1, homelab-2, ...).
openbao_node_id: "homelab-1"

# Where Raft keeps its on-disk state. Stays under /var/lib because
# that's where systemd's default StateDirectory paths land and what
# the .deb-installed unit references.
openbao_data_dir: /var/lib/openbao/data
openbao_log_dir: /var/log/openbao

# Listener config. tls_disable=1 is a homelab convenience until the
# PKI engine inside this OpenBao produces real leaf certs (Phase 4 of
# [[13 Homelab Blueprint]]). Flip to 0 once that's in place, and add
# tls_cert_file/tls_key_file values.
openbao_listen_address: "0.0.0.0:8200"
openbao_tls_disable: 1

# Cluster + API addresses advertised to clients. 127.0.0.1 is correct
# for a single-node setup; switch to the VM's LAN IP if you ever
# expose the cluster port (8201) to peers.
openbao_api_addr: "http://127.0.0.1:8200"
openbao_cluster_addr: "http://127.0.0.1:8201"

# Enable the web UI on /ui. No additional auth gate beyond OpenBao's
# own — keep this VM LAN-only.
openbao_ui: true

# Wire the file audit device declaratively in openbao.hcl. The
# runtime API for audit-enable was removed pre-v2.5; this stanza
# is now the supported path. Set false only if you intentionally
# want OpenBao running without a primary audit sink (unusual —
# every API call is unrecorded). Audit-file rotation lives in a
# separate logrotate(8) config; the role does not currently lay
# that down.
openbao_audit_enabled: true
openbao_audit_log_path: /var/log/openbao/audit.log

# Whether to drop in the systemd override that sets MemorySwapMax=0
# on the openbao process tree. OpenBao removed mlock (PR #363,
# pre-v2.5) and now recommends per-process swap restriction via
# cgroup v2 instead — keeps secret material off disk without
# pinning the whole process in RAM the way mlock did. Set false
# only on hosts where you've configured an equivalent protection
# host-wide (e.g. encrypted swap, swap fully disabled).
openbao_install_systemd_override: true

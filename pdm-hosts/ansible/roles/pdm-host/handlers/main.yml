---
# Handlers run once per play after all notifying tasks complete. Keep
# them minimal and side-effect-explicit — handlers that surprise an
# operator are the worst kind.
#
# Note: there is no `Reload networking` handler. PDM network config is
# set at install time and the role doesn't manage /etc/network/interfaces.

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# `check_mode: false` is required here. tasks/repo.yml flushes this
# handler immediately after writing the no-subscription sources file,
# and the four notifying tasks in repo.yml all carry `check_mode:
# false` so they run during --check. The handler must do the same;
# otherwise the cache refresh would skip in check mode, downstream
# package lookups would hit a stale cache, and packages.yml would
# fail with "No package matching <foo> is available". See the header
# comment in tasks/repo.yml for the full rationale.
- name: Apt update
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  check_mode: false

- name: Restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

# Reload ufw without dropping established connections. Currently
# unused — community.general.ufw applies rule changes immediately, so
# no rule task in firewall.yml needs to notify this. Kept defined so a
# future hand-written /etc/ufw/before.rules template (which doesn't
# apply on its own) has a notify target.
- name: Reload ufw
  community.general.ufw:
    state: reloaded

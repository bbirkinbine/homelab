---
# Replace the enterprise APT sources with the no-subscription set, in
# deb822 format. The PDM ISO ships an enterprise repo pointing at
# enterprise.proxmox.com which 401s without a subscription; we remove
# it (so apt stops failing on every update) and write our own deb822
# sources file covering Debian base + PDM no-subscription.
#
# PDM repo URL differs from PVE/PBS:
#   PVE: http://download.proxmox.com/debian/pve  component=pve-no-subscription
#   PBS: http://download.proxmox.com/debian/pbs  component=pbs-no-subscription
#   PDM: http://download.proxmox.com/debian/pdm  component=pdm-no-subscription
#
# Reference: https://pdm.proxmox.com/docs/installation.html
#
# Idempotency: file module reports `changed` only when the .sources
# template renders different bytes. `apt update` fires via handler ONLY
# when the source list changes, so re-runs on a healthy host are silent.
#
# WHY every mutating task in this file carries `check_mode: false`:
# -----------------------------------------------------------------
# On a freshly-installed PDM host the only Proxmox apt source is
# enterprise.proxmox.com, which 401s without a subscription. With a
# pure --check run, ansible.builtin.file / template are side-effect-
# free, so the enterprise sources stay in place and the no-subscription
# sources are never written. The Apt update handler then runs against
# the broken enterprise repo and produces an empty/stale cache. The
# downstream packages.yml task fails with "No package matching <foo>
# is available", because the cache has no usable index.
#
# Annotating these tasks with `check_mode: false` lets them run in any
# mode, including --check. The trade-off: --check is no longer purely
# side-effect-free for the repo swap and apt cache refresh. Everything
# those tasks mutate is either the desired end state (no-sub sources
# written, enterprise sources removed) or trivially recoverable (apt
# cache regenerated on the next `apt update`). The mutations --check
# *protects against* — package installs, firewall rules, the optional
# NFS mount, the config-backup units — all still simulate normally.
# Only the repo bootstrap leaks through, which is the precondition that
# makes the rest of --check meaningful on a cold host.

- name: Remove legacy enterprise PDM repo (single-line format)
  ansible.builtin.file:
    path: "{{ pdm_host_enterprise_list }}"
    state: absent
  check_mode: false
  notify: Apt update

# The PDM ISO ships the enterprise repo in deb822 form
# (/etc/apt/sources.list.d/pdm-enterprise.sources). Same enterprise.
# proxmox.com URL, same 401 problem. Remove both forms so re-runs don't
# depend on installer vintage.
- name: Remove enterprise PDM repo (deb822 format)
  ansible.builtin.file:
    path: "{{ pdm_host_enterprise_sources }}"
    state: absent
  check_mode: false
  notify: Apt update

# Proxmox's archive key ships with the proxmox-archive-keyring package
# on a stock install. Ensure it's present before the no-subscription
# repo file references it via Signed-By.
- name: Ensure proxmox-archive-keyring is installed
  ansible.builtin.apt:
    name: proxmox-archive-keyring
    state: present
    update_cache: false
  check_mode: false

- name: Write PDM + Debian no-subscription sources (deb822)
  ansible.builtin.template:
    src: etc/apt/sources.list.d/pdm-no-subscription.sources.j2
    dest: "{{ pdm_host_sources_file }}"
    owner: root
    group: root
    mode: "0644"
  check_mode: false
  notify: Apt update

# Force the update before downstream tasks (packages.yml) try to install
# anything. The handler-flush guarantees the cache is fresh. The
# `Apt update` handler (handlers/main.yml) also carries `check_mode:
# false` so the cache refresh actually runs during --check.
- name: Flush handlers (refresh apt cache before package installs)
  ansible.builtin.meta: flush_handlers
